name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python examples/count_demo_requests.py
      - run: python examples/chat_responses_gap.py

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build==1.6.1
      - run: python -m build --wheel
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -c "import tomllib; from pathlib import Path; import llm_endpoint_doctor as p; assert p.__version__ == tomllib.loads(Path('pyproject.toml').read_text())['project']['version']; assert 'site-packages' in p.__file__"
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: python-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
