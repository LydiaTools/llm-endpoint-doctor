[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-endpoint-doctor"
version = "0.5.0"
description = "A local-first smoke test for OpenAI-compatible chat, vision-input, and image-generation endpoints."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "LydiaTools" }]
keywords = ["llm", "vision", "image-generation", "openai-compatible", "api", "developer-tools", "diagnostics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
llm-doctor = "llm_endpoint_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
